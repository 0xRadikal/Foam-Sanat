name: Secret Scan

# ⚠️ ACTIVATION REQUIRED: move this file to `.github/workflows/secret-scan.yml`
# to enable it. It lives in `pending-workflows/` because the automation bot
# that opened the PR lacks GitHub App `workflows` permission to create files
# under `.github/workflows/`. A repo owner must relocate it:
#   git mv .github/pending-workflows/secret-scan.yml .github/workflows/secret-scan.yml
#
# Runs gitleaks on every push and pull request to detect committed secrets.
# Also runs on a weekly schedule to catch anything that slips past PR review.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Fetch full history so gitleaks can scan every commit, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No license needed for public repos / individual accounts.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Scan the entire git history on scheduled/dispatch runs; PR runs
          # scan only the PR range automatically.
